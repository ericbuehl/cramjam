name: debug-hypothesis
on:
  push:
    branches: [debug-hypothesis-internalerror]
  workflow_dispatch:

jobs:
  # Control: full suite, rewriting on, NO conftest fix (checkout of PR branch
  # conftest is overwritten below). Expect ~50% failure rate.
  control:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Revert conftest fix
        run: |
          python - <<'EOF'
          import re
          p = "tests/conftest.py"
          src = open(p).read()
          # strip everything between the injected comment block and the pytest import
          src = src.split("import pytest", 1)
          open(p, "w").write("import platform\nimport sysconfig\n\nimport pytest" + src[1])
          print(open(p).read()[:200])
          EOF
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: -i 3.13 --release --out dist
      - name: Install and test
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install cramjam[dev] --pre --find-links dist
          python -m pytest -vs --benchmark-skip -n0 --dist no

  # Candidate fix: full suite, rewriting on, conftest eagerly imports the
  # lazily-loaded hypothesis modules. Expect green.
  eager-import-fix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: -i 3.13 --release --out dist
      - name: Install and test
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install cramjam[dev] --pre --find-links dist
          python -m pytest -vs --benchmark-skip -n0 --dist no
