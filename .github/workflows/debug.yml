name: debug-hypothesis
on:
  push:
    branches: [debug-hypothesis-internalerror]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: -i 3.13 --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist

  # Candidate pin: last pure-python hypothesis release.
  pure-hypothesis:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install and test
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install 'hypothesis==6.155.7' 'pytest==9.1.1' 'pytest-benchmark==5.2.3' 'pytest-xdist==3.8.0' numpy
          python -c "import hypothesis; print(hypothesis.__version__, hypothesis.__file__)"
          python -m pytest -vs --benchmark-skip -n0 --dist no

  # Sanity: first compiled release also corrupts? (narrow blame to the
  # compiled engine rather than 6.156..6.165 logic changes)
  first-compiled:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iteration: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install and test
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install 'hypothesis==6.156.1' 'pytest==9.1.1' 'pytest-benchmark==5.2.3' 'pytest-xdist==3.8.0' numpy
          python -m pytest -vs --benchmark-skip -n0 --dist no
