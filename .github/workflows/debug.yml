name: debug-hypothesis
on:
  push:
    branches: [debug-hypothesis-internalerror]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ref: a53c8bf210c47ffe3122cd9807e00aaa77fc4ed7  # master (has pyo3 0.29, #243)
            name: post-243
          - ref: 9c15ea47570f57be70477cd3464b58fe306fe25b  # pre-#243 (pyo3 0.28)
            name: pre-243
    steps:
      - uses: actions/checkout@v4
        with:
          repository: milesgranger/cramjam
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: -i 3.13 --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wheel: [pre-243, post-243]
        iteration: [1, 2, 3, 4, 5, 6]
        include: []
    steps:
      # Check out the test suite matching each wheel (test_variants.py is
      # unchanged between the two refs).
      - uses: actions/checkout@v4
        with:
          repository: milesgranger/cramjam
          ref: ${{ matrix.wheel == 'pre-243' && '9c15ea47570f57be70477cd3464b58fe306fe25b' || 'a53c8bf210c47ffe3122cd9807e00aaa77fc4ed7' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist
      - name: Install and test
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install 'hypothesis==6.165.10' 'pytest==9.1.1' 'pytest-benchmark==5.2.3' 'pytest-xdist==3.8.0' numpy
          python -c "import cramjam; print(cramjam.__version__)"
          python -m pytest -vs --benchmark-skip -n0 --dist no
