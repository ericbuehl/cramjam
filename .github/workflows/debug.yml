name: debug-hypothesis
on:
  push:
    branches: [debug-hypothesis-internalerror]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        iteration: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set MSVC developer prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build wheel (Linux)
        if: runner.os != 'Windows'
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: -i 3.13 --release --out dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install maturin delvewheel
          maturin build -i python --release --out wheels --target x86_64-pc-windows-msvc
          $file = Get-ChildItem -Path "wheels" | Select-Object -First 1
          delvewheel repair -v "wheels\$($file.Name)" -w "dist"

      - name: Install built wheel and Test (Native)
        run: |
          python -m pip install cramjam --pre --no-index --find-links dist --force-reinstall
          python -m pip install cramjam[dev] --pre --find-links dist

          python -m pytest -vs --benchmark-skip -n0 --dist no
